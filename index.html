<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title></title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }
    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #111;
    }
    img {
      display: block;
      width: min(90vw, 594px);
      height: auto;
      max-height: 90vh;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <img src="captura.png" alt="Captura del mensaje" fetchpriority="high">
</body>
</html>
